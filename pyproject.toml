[project]
name = "lasso-voice"
version = "0.1.0"
description = "Self-improving cart-recovery voice agent — pipecat + Twilio. Embed a script tag; on checkout abandonment it calls the shopper, recovers the cart, and learns why people abandon."
requires-python = ">=3.11"
dependencies = [
    # Web / control plane
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    # Telephony
    "twilio>=9.3.0",
    # Voice pipeline. Twilio serializer is in pipecat core (no extra); provider extras
    # are one-line swaps. gradium/cerebras pulled for sponsor-model swaps; mcp for the
    # Cekura MCP wiring later.
    "pipecat-ai[deepgram,cartesia,openai,silero,gradium,cerebras,mcp]>=1.3.0",
    # Data
    "supabase>=2.9.0",
    # Direct use in the Cekura loop (also pulled transitively via pipecat[openai]).
    "openai>=1.50.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
